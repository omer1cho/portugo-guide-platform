<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דפי סריקה להדפסה - הטיפים של פורטוגו</title>
<link rel="icon" type="image/png" href="/logo.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #0a3d22;
    --gold: #bfa14f;
    --bg: #faf6ee;
    --surface: #fffdf8;
    --ink-soft: #5b5f54;
    --border: #e3ddcf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Assistant', -apple-system, sans-serif;
    background: #e8e4da;
    color: var(--forest);
  }

  /* פס הנחיות למסך בלבד - לא מודפס */
  .toolbar {
    text-align: center;
    padding: 14px;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .toolbar button {
    font-family: inherit;
    font-size: 16px; font-weight: 700;
    color: #fff;
    background: var(--forest);
    border: none;
    border-radius: 10px;
    padding: 10px 26px;
    cursor: pointer;
    margin-inline-start: 12px;
  }

  /* עמוד A4 */
  .sheet {
    width: 210mm;
    height: 296mm;
    margin: 0 auto 16px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18mm 16mm;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--surface);
    border: 1.5pt solid var(--gold);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12mm 12mm 52mm;
    gap: 12mm;
  }
  .logo { height: 24mm; width: auto; }
  .title {
    font-size: 34pt;
    font-weight: 800;
    line-height: 1.15;
    color: var(--forest);
  }
  .qr-wrap {
    background: #fff;
    border: 1pt solid var(--border);
    border-radius: 14px;
    padding: 9mm;
  }
  .qr-wrap svg { width: 94mm; height: 94mm; display: block; }

  /* תמונת אווירה שקופה ועדינה בתחתית הכרטיס */
  .photo-strip {
    position: absolute;
    bottom: 0;
    inset-inline: 0;
    height: 62mm;
    pointer-events: none;
  }
  .photo-strip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0.4;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 55%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 55%);
  }

  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet {
      margin: 0;
      box-shadow: none;
      page-break-after: always;
    }
    .sheet:last-of-type { page-break-after: auto; }
  }
  @page { size: A4; margin: 0; }
</style>
</head>
<body>

<div class="toolbar">
  שני עמודים: ליסבון ופורטו. מדפיסים בגודל מלא (100%), בלי שוליים.
  <button onclick="window.print()">הדפסה</button>
</div>

</div>
